# Stage-2 · L2 BIOPSY — late fusion: V1 image mean + clinical MLP
#
# Same architecture as AKD L2 but on the biopsy cohort.
# Image per-patch → 768→256 → patient-mean; clinical 50→64; concat → 128→4.
#
# Usage:
#   python scripts/stage2_train.py --patient-key 病理号 \
#       --config configs/stage2_biopsy_l2_late_fusion.yaml

train:
  epochs: 30
  batch_size: 64
  patience: 5
  seed: 42
  warmup_frac: 0.05
  logit_pool: per_patient_logit_mean

model:
  run: l2_biopsy
  kind: late_fusion
  features_npy: features/v1_stage2_biopsy.npy
  meta_parquet: features/v1_stage2_biopsy_meta.parquet
  image_proj_dim: 256
  clinical_proj_dim: 64
  fusion_mlp_hidden: 128
  dropout: 0.3

optim:
  name: AdamW
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

loss:
  kind: bce_logits
  pos_weight: per_outcome_neg_over_pos

data:
  cohort: data/stage2_cohort_biopsy.parquet
  folds:  data/stage2_folds_biopsy.json
  outcome_cols: [outcome1, outcome2, outcome3, outcome4]
  clinical_cols: con_val_alt..con_val_utp

eval:
  scope: patient
  threshold: 0.5

checkpoints:
  out_dir: checkpoints/stage2_biopsy_l2
